name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,15 * * *"
      timezone: "Asia/Tokyo"

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          renovate-version: 43.277.0
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: "sendo-kakeru/omojan"
