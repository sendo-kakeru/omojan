name: CI E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  E2E_BASE_DB_NAME: "omojan-main-e2e"

concurrency:
  group: ci-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  migrate-e2e-base-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: $/.github/actions/setup-pnpm

      - name: Install Turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> $GITHUB_PATH

      - name: Build DB package
        run: pnpm turbo run build --filter @repo/db

      - name: E2E Base Database Migration
        working-directory: packages/db
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          DATABASE_URL=$(turso db show "${E2E_BASE_DB_NAME}" --url)
          TURSO_AUTH_TOKEN=$(turso db tokens create "${E2E_BASE_DB_NAME}" --expiration 1d)
          export DATABASE_URL
          export TURSO_AUTH_TOKEN
          ENV=e2e pnpm drizzle-kit migrate

  test:
    needs: migrate-e2e-base-db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ブラウザと依存パッケージがプリインストールされたイメージを使い、apt やブラウザのダウンロードを省く
    # タグは packages/web の @playwright/test のバージョンと揃える（renovate.json でグループ化済み）
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    environment: e2e
    env:
      VITE_API_URL: http://localhost:8787
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
      VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      ENV: e2e
      JWT_SECRET: e2e-secret
      WEB_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: $/.github/actions/setup-pnpm

      - name: Install Turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> $GITHUB_PATH

      - name: Setup E2E Database
        id: setup-db
        uses: $/.github/actions/setup-e2e-db
        with:
          turso-api-token: ${{ secrets.TURSO_API_TOKEN }}
          source-db: ${{ env.E2E_BASE_DB_NAME }}

      - name: Build dependencies packages
        run: |
          pnpm turbo run build --filter @repo/db
          pnpm turbo run build --filter @repo/mock
          pnpm turbo run build --filter @repo/shared
          pnpm turbo run build --filter @repo/api

      - name: Create .dev.vars.e2e for API
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ steps.setup-db.outputs.database-url }}
          TURSO_AUTH_TOKEN: ${{ steps.setup-db.outputs.database-token }}
        run: |
          set -eu
          : "${DATABASE_URL:?DATABASE_URL is required}"
          : "${TURSO_AUTH_TOKEN:?TURSO_AUTH_TOKEN is required}"
          cat > .dev.vars.e2e <<EOF
          DATABASE_URL=${DATABASE_URL}
          TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
          COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
          COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
          WEB_URL=${WEB_URL}
          JWT_SECRET=${JWT_SECRET}
          ENV=${ENV}
          EOF

      - name: Create .env.e2e for Web
        working-directory: packages/web
        env:
          DATABASE_URL: ${{ steps.setup-db.outputs.database-url }}
          TURSO_AUTH_TOKEN: ${{ steps.setup-db.outputs.database-token }}
        run: |
          cat > .env.e2e <<EOF
          DATABASE_URL=${DATABASE_URL}
          TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
          EOF

      - name: Run Playwright tests
        working-directory: packages/web
        run: pnpm playwright test

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/web/e2e/playwright-report/
          retention-days: 30

      - name: Delete E2E Database
        if: always()
        uses: $/.github/actions/delete-e2e-db
        with:
          turso-api-token: ${{ secrets.TURSO_API_TOKEN }}
          database-name: ${{ steps.setup-db.outputs.database-name }}
