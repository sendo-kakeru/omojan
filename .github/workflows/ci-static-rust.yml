name: CI Static Rust

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "packages/image-processor/**"
      - ".github/workflows/ci-static-rust.yml"
      - ".github/workflows/deploy-image-processor-*.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/image-processor
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/image-processor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/image-processor/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings -W clippy::pedantic

      - name: Build release
        run: cargo build --release
