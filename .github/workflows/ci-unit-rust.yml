name: CI Unit Rust

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "packages/image-processor/**"
      - ".github/workflows/ci-unit-rust.yml"
      - ".github/workflows/deploy-image-processor-*.yml"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/image-processor
    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/image-processor/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('packages/image-processor/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Run tests
        run: cargo test
