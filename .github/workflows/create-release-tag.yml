name: Create Release Tag
on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate tag
        id: release_tag
        run: |
          current_time=$(date +'%Y.%m.%d.%H.%M')
          echo "release_tag=0.0.0-$current_time" >> $GITHUB_OUTPUT

      - name: Set up Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Create tag
        run: |
          git tag -a ${{ steps.release_tag.outputs.release_tag }} -m "Release"
          git push origin ${{ steps.release_tag.outputs.release_tag }}
