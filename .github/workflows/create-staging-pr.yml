name: Create Staging PR
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate PR body
        run: |
          # PR情報を一括取得してローカルでフィルタリング
          pr_list=$(gh pr list --state merged --limit 200 --json number,title)
          {
            echo "## 変更内容"
            echo ""
            git log origin/staging..origin/develop --merges --pretty=format:"%s" | while IFS= read -r message; do
              pr_num=$(echo "$message" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
              if [ -n "$pr_num" ]; then
                pr_title=$(echo "$pr_list" | jq -r ".[] | select(.number == ${pr_num}) | .title")
                if [ -n "$pr_title" ]; then
                  printf -- '- [#%s %s](https://github.com/%s/pull/%s)\n' "$pr_num" "$pr_title" "$GITHUB_REPOSITORY" "$pr_num"
                fi
              fi
            done
          } > pr_body.txt

      - name: Create PR
        run: |
          gh pr create \
            --title "Deploy to staging" \
            --body-file pr_body.txt \
            --base staging \
            --head develop
