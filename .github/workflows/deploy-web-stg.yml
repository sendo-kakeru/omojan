name: Deploy Web Staging
on:
  push:
    branches:
      - staging
    paths:
      - packages/web/**
      - packages/db/**
      - packages/shared/**
      - packages/typescript-config/**
      - .github/workflows/deploy-web-stg.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      CLOUDFLARE_ENV: staging
      VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: https://auth-stg.omojan.com
      VITE_API_URL: https://api-stg.omojan.com
      VITE_CDN_URL: https://cdn-stg.omojan.com
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build dependencies packages
        run: |
          pnpm turbo run build --filter @repo/db
          pnpm turbo run build --filter @repo/shared
          pnpm turbo run build --filter @repo/api

      - name: Build
        run: pnpm run build --mode staging
        working-directory: packages/web

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/web
