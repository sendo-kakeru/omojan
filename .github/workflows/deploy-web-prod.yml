name: Deploy Web Production
on:
  # deploy-migration-api-web-prod.yml から呼び出す
  workflow_call:

permissions:
  contents: read

# 直列化は呼び出し元（deploy-migration-api-web-prod.yml）の concurrency で行う
# 呼び出される側では github.workflow が呼び出し元の名前になり group が衝突しうるため、ここには設定しない

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      CLOUDFLARE_ENV: production
      VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: https://auth.omojan.com
      VITE_API_URL: https://api.omojan.com
      VITE_CDN_URL: https://cdn.omojan.com
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: $/.github/actions/setup-pnpm

      - name: Build dependencies packages
        run: |
          pnpm turbo run build --filter @repo/db
          pnpm turbo run build --filter @repo/shared
          pnpm turbo run build --filter @repo/api

      - name: Build
        run: pnpm run build
        working-directory: packages/web
      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/web
