name: CI E2E

on:
  pull_request_target:
    types:
      - opened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    env:
      VITE_API_URL: http://localhost:8787
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
      VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENV: e2e
      JWT_SECRET: e2e-secret
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      WEB_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build dependencies packages
        run: |
          pnpm turbo run build --filter @repo/db
          pnpm turbo run build --filter @repo/mock
          pnpm turbo run build --filter @repo/shared
          pnpm turbo run build --filter @repo/api

      - name: Create .dev.vars.e2e for API
        working-directory: packages/api
        run: |
          set -eu
          : "${DATABASE_URL:?DATABASE_URL is required}"
          : "${TURSO_AUTH_TOKEN:?TURSO_AUTH_TOKEN is required}"
          cat > .dev.vars.e2e <<EOF
          DATABASE_URL=${DATABASE_URL}
          TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
          COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
          COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
          WEB_URL=${WEB_URL}
          JWT_SECRET=${JWT_SECRET}
          ENV=${ENV}
          EOF

      - name: Install Playwright Browsers
        working-directory: packages/web
        run: pnpm playwright install --with-deps

      - name: Run Playwright tests
        working-directory: packages/web
        run: pnpm playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/web/e2e/playwright-report/
          retention-days: 30
