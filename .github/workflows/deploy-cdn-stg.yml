name: Deploy CDN Staging
on:
  push:
    branches:
      - staging
    paths:
      - packages/cdn/**
      - packages/shared/**
      - packages/typescript-config/**
      - .github/workflows/deploy-cdn-stg.yml

permissions:
  contents: read

# 途中で止めると中途半端な状態になるため、キャンセルせず直列に実行する
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: $/.github/actions/setup-pnpm

      - name: Build dependencies packages
        run: pnpm turbo run build --filter @repo/shared

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/cdn
          command: deploy --env staging
