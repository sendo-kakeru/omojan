name: Deploy API Production
on:
  # deploy-migration-api-web-prod.yml から呼び出す
  workflow_call:

permissions:
  contents: read

# concurrency は呼び出し元で設定済み（ここに書くと group が衝突しうる）

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: $/.github/actions/setup-pnpm

      - name: Build dependencies packages
        run: |
          pnpm turbo run build --filter @repo/db
          pnpm turbo run build --filter @repo/shared

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api
          command: deploy --env production
